name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  # Kept as its own job on purpose: make this the required status check in branch
  # protection. If this test is ever removed or disabled, the entire record is worthless.
  leakage-guard:
    name: leakage guard (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest tests/test_leakage_guard.py -v

  test:
    name: lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  docker:
    name: image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t openoutcry:ci .
